name: Deploy Studio to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Studio artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run repository verification
        shell: bash
        run: npm test

      - name: Validate DXF offset defaults
        shell: bash
        run: node pipetools/symbols/dxf/validate-dxf-offsets.mjs

      - name: Prepare static Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/studio _site/pipetools _site/spl2-bundle _site/data/indexes _site/data/normalized _site/data/search _site/data/audit _site/data/exports
          cp -R studio/. _site/studio/
          cp -R pipetools/. _site/pipetools/
          cp -R spl2-bundle/. _site/spl2-bundle/
          cp data/indexes/component-search.index.json _site/data/indexes/
          cp data/normalized/*.json _site/data/normalized/
          cp data/search/component-aliases.json _site/data/search/
          cp data/audit/*.json _site/data/audit/
          cp data/exports/*.json _site/data/exports/
          test -f _site/studio/index.html
          test -f _site/studio/component-studio-app.js
          test -f _site/pipetools/index.html
          test -f _site/pipetools/data/db-index.json
          test -f _site/pipetools/data/dxf-symbol-offsets.json
          test -f _site/pipetools/vendor/pipespec-svg/svg-engine.js
          test -f _site/pipetools/pipeSpanDetail.css
          test -f _site/pipetools/js/app.js
          test -f _site/pipetools/js/uiScopePatch.js
          test -f _site/pipetools/js/search/search.js
          test -f _site/pipetools/js/svg/inspector.js
          test -f _site/pipetools/js/svg/auditGeneral.js
          test -f _site/pipetools/js/svg/pipeSpecSvgAdapter.js
          test -f _site/pipetools/js/svg/pipeSpecSvgEngine.js
          test -f _site/pipetools/js/pipeSpan/calculate.js
          test -f _site/pipetools/js/pipeSpan/detailedTable.js
          test -f _site/spl2-bundle/spl2_master.html
          test -f _site/spl2-bundle/css/app.css
          test -f _site/spl2-bundle/js/spl2/spl2_master.js
          test -f _site/data/indexes/component-search.index.json
          test -f _site/data/search/component-aliases.json
          test -f _site/data/audit/db-coverage-dashboard.json
          test -f _site/data/audit/source-use-policy.json
          test -f _site/data/exports/db-export-manifest.json
          test -f _site/data/exports/public-export-pack.manifest.json
          test -f _site/data/normalized/valves.json
          if [ -d _site/docs/Pipedata/Database ]; then
            echo "ERROR: Raw source database tree must not be published to Pages"
            exit 1
          fi
          printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="refresh" content="0; url=./pipetools/"><title>PipeTools Suite</title></head><body><p><a href="./pipetools/">Open PipeTools Suite</a></p><p><a href="./studio/">Open Pipe Component Studio</a></p></body></html>' > _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy Studio artifact
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
