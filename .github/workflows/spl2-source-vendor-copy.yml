name: SPL2 Source Vendor Copy

on:
  push:
    branches:
      - agent15/wave-11b-spl2-source-copy

permissions:
  contents: write

jobs:
  copy-spl2-source:
    if: ${{ !contains(github.event.head_commit.message, '[skip spl2-copy]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: agent15/wave-11b-spl2-source-copy
          fetch-depth: 0

      - name: Copy exact SPL2 source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/simplified-analysis
          git clone --depth 1 https://github.com/reallaksh19/Simplified_Analysis.git /tmp/simplified-analysis
          test -f /tmp/simplified-analysis/public/spl2-bundle/spl2_master.html
          test -f /tmp/simplified-analysis/public/spl2-bundle/js/spl2/spl2_master.js
          test -f /tmp/simplified-analysis/public/spl2-bundle/js/spl2/spl2_database.js
          rm -rf spl2-bundle
          mkdir -p spl2-bundle
          cp -R /tmp/simplified-analysis/public/spl2-bundle/. spl2-bundle/
          rm -f .github/workflows/spl2-source-vendor-copy.yml

      - name: Commit vendored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spl2-bundle gates/pipetools-agent-14-spl2-parity.gate.test.js .github/workflows/spl2-source-vendor-copy.yml
          if git diff --cached --quiet; then
            echo "No SPL2 source changes to commit."
            exit 0
          fi
          git commit -m "feat(pipetools): vendor exact SPL2 source bundle [skip spl2-copy]"
          git push origin HEAD:agent15/wave-11b-spl2-source-copy
