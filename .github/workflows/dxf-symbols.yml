name: DXF Symbol Library QA

on:
  pull_request:
    paths:
      - 'pipetools/symbols/dxf/**'
      - '.github/workflows/dxf-symbols.yml'
  push:
    paths:
      - 'pipetools/symbols/dxf/**'
      - '.github/workflows/dxf-symbols.yml'
  workflow_dispatch:

jobs:
  validate-dxf-symbols:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate DXF symbol manifest and SVG assets
        run: node pipetools/symbols/dxf/validate-dxf-symbols.mjs
