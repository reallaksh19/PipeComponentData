<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PipeTools DXF Symbol Library</title>
  <style>
    body { margin:0; background:#07111f; color:#e6edf7; font:14px/1.45 system-ui, sans-serif; }
    .top { padding:18px 22px; border-bottom:1px solid #25364d; background:#0d1a2b; }
    h1 { margin:0 0 6px; font-size:30px; }
    .top p { margin:0; color:#91a0b6; }
    .stats { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .pill, .badge { border:1px solid #25364d; border-radius:999px; padding:5px 9px; color:#91a0b6; font-size:12px; }
    .badge.ok { color:#34d399; } .badge.warn { color:#fbbf24; }
    .toolbar { display:grid; grid-template-columns:1fr minmax(240px,420px); gap:14px; padding:14px 22px; border-bottom:1px solid #25364d; }
    .families { display:flex; gap:8px; overflow:auto; }
    .chip { border:1px solid #25364d; background:#101f33; color:#e6edf7; border-radius:999px; padding:7px 10px; cursor:pointer; white-space:nowrap; }
    .chip.active { background:#38bdf8; color:#032235; border-color:#38bdf8; font-weight:800; }
    .search { border:1px solid #25364d; background:#07111f; color:#e6edf7; border-radius:12px; padding:10px 12px; }
    .workspace { display:grid; grid-template-columns:minmax(460px,1fr) minmax(340px,460px); gap:16px; padding:18px 22px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; align-content:start; }
    .card { border:1px solid #25364d; border-radius:16px; background:#0d1a2b; padding:11px; cursor:pointer; }
    .card.selected { outline:2px solid #38bdf8; }
    .card header { display:flex; justify-content:space-between; color:#91a0b6; font-size:12px; }
    .card header b { color:#38bdf8; }
    .card img { width:100%; height:120px; object-fit:contain; background:#fff; border-radius:12px; margin:9px 0; }
    .card h2 { font-size:15px; margin:0 0 3px; }
    .card p { margin:0 0 8px; color:#91a0b6; font-size:12px; }
    .detail { border:1px solid #25364d; border-radius:18px; background:#0d1a2b; overflow:hidden; align-self:start; }
    .detail-figure { background:#fff; display:grid; place-items:center; min-height:260px; padding:18px; }
    .detail-figure img { width:100%; max-height:320px; object-fit:contain; }
    .detail-meta { padding:14px; }
    .detail-meta dl { border:1px solid #25364d; border-radius:12px; overflow:hidden; }
    .detail-meta dl div { display:grid; grid-template-columns:120px 1fr; gap:10px; padding:7px 10px; border-bottom:1px solid #25364d; }
    dt { color:#91a0b6; } dd { margin:0; text-align:right; overflow-wrap:anywhere; }
    pre { background:#06101e; border:1px solid #25364d; border-radius:12px; padding:10px; overflow:auto; color:#cbd5e1; }
    .empty { border:1px dashed #25364d; border-radius:14px; padding:18px; color:#91a0b6; }
    @media (max-width:1100px) { .toolbar, .workspace { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header class="top">
    <h1>DXF-Based Piping Symbol Library</h1>
    <p>Static viewer for converted DXF/SVG symbols. Cards reference real files under <code>symbols/</code>; unsupported rows resolve to <code>SVG_NOT_AVAILABLE</code>.</p>
    <div class="stats"><span class="pill"><b id="shownCount">0</b> shown</span><span class="pill"><b id="totalCount">0</b> mapped</span><span class="pill">DB: <b id="dbStatus">optional</b></span></div>
  </header>
  <section class="toolbar">
    <nav id="familyNav" class="families"></nav>
    <input id="searchBox" class="search" type="search" placeholder="Search code, title, subtype, standard...">
  </section>
  <section class="workspace">
    <div id="symbolGrid" class="grid"></div>
    <aside id="detailPanel" class="detail"></aside>
  </section>
  <script src="js/symbol-library.js"></script>
</body>
</html>
